# =============================================================================
# Configuratie Nginx - Reverse Proxy si Server de Fisiere Statice
# =============================================================================
# Nginx indeplineste doua roluri principale in aceasta arhitectura:
#
# 1. SERVER DE FISIERE STATICE
#    Serveste aplicatia React (HTML, JS, CSS, imagini) construita de Vite.
#    Fisierele se afla in /usr/share/nginx/html (copiate in Dockerfile).
#
# 2. REVERSE PROXY
#    Ruteaza cererile API si WebSocket catre backend-ul Node.js.
#    Utilizatorii interactioneaza DOAR cu Nginx (portul 80).
#    Nginx decide intern ce cereri merg la backend si ce cereri sunt
#    servite ca fisiere statice.
#
# Fluxul unei cereri:
#   Browser -> Nginx:80 -> /api/*       -> proxy catre api:3000
#                       -> /socket.io/* -> proxy WebSocket catre api:3000
#                       -> /altceva     -> servire fisier static sau index.html
# =============================================================================

server {
    # Portul pe care Nginx asculta. 80 = HTTP standard.
    # Pentru HTTPS, adaugati "listen 443 ssl;" si configurati certificatele SSL.
    listen 80;

    # Numele serverului. "_" (underscore) inseamna "accepta orice domeniu".
    # In productie, inlocuiti cu domeniul real: server_name crm.amass.ro;
    # Acest lucru permite hosting de mai multe site-uri pe acelasi server.
    server_name _;

    # Directorul radacina din care Nginx serveste fisierele statice.
    # Acesta contine build-ul Vite al aplicatiei React (copiat in Dockerfile).
    root /usr/share/nginx/html;

    # Fisierul implicit servit cand se acceseaza un director.
    # index.html este punctul de intrare al aplicatiei React SPA.
    index index.html;

    # -------------------------------------------------------------------------
    # PROXY API - Redirijarea cererilor backend
    # -------------------------------------------------------------------------
    # Toate cererile care incep cu /api/ sunt trimise catre backend-ul Node.js.
    # Exemplu: GET /api/clients -> proxy catre http://api:3000/api/clients
    #
    # "api" in proxy_pass este numele serviciului Docker din docker-compose.yml.
    # Docker rezolva automat acest nume la adresa IP a containerului API.
    #
    # Fara acest proxy, frontend-ul ar trebui sa cunoasca adresa directa a API-ului,
    # ceea ce ar cauza probleme CORS si ar expune portul API-ului extern.
    # -------------------------------------------------------------------------
    location /api/ {
        # Trimite cererea catre containerul API pe portul 3000.
        # Nginx pastreaza calea originala (ex: /api/clients ramane /api/clients).
        proxy_pass http://api:3000;

        # Foloseste HTTP/1.1 (necesar pentru conexiuni persistente si WebSocket upgrade).
        # HTTP/1.0 (default-ul proxy_pass) nu suporta header-ul "Connection: upgrade".
        proxy_http_version 1.1;

        # Urmatoarele header-e sunt necesare pentru suportul WebSocket si
        # pentru transmiterea corecta a informatiilor clientului catre backend:

        # Transmite header-ul "Upgrade" de la client catre backend.
        # Necesar pentru upgrade-ul de la HTTP la WebSocket.
        proxy_set_header Upgrade $http_upgrade;

        # Seteaza "Connection: upgrade" pentru a mentine conexiunea deschisa
        # in cazul unui upgrade WebSocket.
        proxy_set_header Connection 'upgrade';

        # Transmite hostname-ul original al cererii catre backend.
        # Fara acesta, backend-ul ar vedea "api:3000" ca Host in loc de domeniul real.
        proxy_set_header Host $host;

        # Dezactiveaza cache-ul Nginx pentru cererile cu header "Upgrade".
        # Asigura ca cererile WebSocket nu sunt servite din cache.
        proxy_cache_bypass $http_upgrade;
    }

    # -------------------------------------------------------------------------
    # PROXY WEBSOCKET - Conexiuni in timp real (Socket.IO)
    # -------------------------------------------------------------------------
    # Socket.IO foloseste calea /socket.io/ pentru comunicatii in timp real.
    # Aceste conexiuni sunt upgrade-uri de la HTTP la WebSocket si necesita
    # o configuratie speciala de proxy.
    #
    # Socket.IO este folosit in CRM pentru:
    #   - Notificari in timp real (client nou, activitate noua)
    #   - Sincronizarea datelor intre utilizatori (multi-user editing)
    #   - Status online/offline al vanzatorilor
    #
    # IMPORTANT: Aceasta locatie este separata de /api/ deoarece
    # conexiunile WebSocket au un ciclu de viata diferit (conexiuni persistente,
    # long-lived) fata de cererile HTTP obisnuite (request-response).
    # -------------------------------------------------------------------------
    location /socket.io/ {
        # Trimite cererile Socket.IO catre backend-ul API
        proxy_pass http://api:3000;

        # HTTP/1.1 este obligatoriu pentru WebSocket - suporta header-ul Upgrade
        proxy_http_version 1.1;

        # Header-ele necesare pentru upgrade-ul conexiunii la WebSocket.
        # Fara acestea, conexiunea WebSocket nu se poate stabili si
        # Socket.IO va cadea pe fallback-ul de long-polling (mai lent).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Transmite hostname-ul original pentru ca backend-ul sa poata
        # valida originea conexiunii (securitate CORS/WebSocket).
        proxy_set_header Host $host;
    }

    # -------------------------------------------------------------------------
    # SPA FALLBACK - Rutare pentru aplicatia React Single Page
    # -------------------------------------------------------------------------
    # Aceasta este regula fundamentala pentru orice aplicatie SPA (Single Page App).
    #
    # Problema: Aplicatia React foloseste rutare pe client (React Router).
    # Cand utilizatorul navigheaza la /clients/abc123, browserul trimite o cerere
    # HTTP pentru acea cale. Dar pe disc nu exista un fisier /clients/abc123 -
    # exista doar index.html care contine intreaga aplicatie React.
    #
    # Solutia: try_files incearca in ordine:
    #   1. $uri       - cauta un fisier exact cu acea cale (ex: /assets/logo.png)
    #   2. $uri/      - cauta un director cu acea cale
    #   3. /index.html - daca nici fisier, nici director, serveste index.html
    #                    React Router va interpreta URL-ul si va afisa pagina corecta.
    #
    # Fara aceasta regula, orice refresh al paginii sau navigare directa la un URL
    # ar returna eroarea 404 Not Found.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # CACHE RESURSE STATICE - Optimizare performanta
    # -------------------------------------------------------------------------
    # Fisierele statice generate de Vite au hash-uri unice in numele lor
    # (ex: main.a1b2c3d4.js). Cand codul se schimba, hash-ul se schimba,
    # iar browserul descarca automat noua versiune.
    #
    # Aceasta regula se potriveste pe extensiile de fisiere statice folosind
    # o expresie regulata (~* = case-insensitive regex match):
    #   .js, .css          - cod JavaScript si stiluri
    #   .png, .jpg, .jpeg, .gif, .ico, .svg - imagini
    #   .woff, .woff2      - fonturi web
    #
    # "expires 30d" - seteaza header-ul Expires la 30 de zile in viitor.
    #   Browserul va folosi copia din cache timp de 30 de zile fara a mai
    #   face o cerere catre server (zero round-trips).
    #
    # "Cache-Control: public, immutable":
    #   - "public" - permite cache-uirea de catre CDN-uri si proxy-uri intermediare
    #   - "immutable" - spune browserului ca fisierul NU se va schimba niciodata
    #     (datorita hash-ului din nume). Previne cererile de revalidare inutile.
    #
    # Rezultat: dupa prima incarcare, resursele statice se incarca instant din cache.
    # -------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
